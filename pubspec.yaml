name: interface_browser
description: "Interface Browser — a fast, themeable web browser for Android & Windows. Navy blue + cyan by default, Chrome × Opera inspired UX."
publish_to: 'none'

# Android: versionName / versionCode. Windows: product file version.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Web engine: Android (WebView), Windows (WebView2), iOS, macOS.
  flutter_inappwebview: 6.1.5

  # State management.
  provider: ^6.1.0

  # Persistence (settings, bookmarks, history, speed dial, session).
  shared_preferences: ^2.3.0

  # Filesystem locations (downloads dir, app-support for wallpapers).
  path_provider: ^2.1.0

  # Search suggestions + file downloads.
  http: ^1.2.0

  # tel: / mailto: / open-in-default-browser.
  url_launcher: ^6.3.0

  # Custom background picture picker (Android + Windows).
  file_picker: ^12.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
